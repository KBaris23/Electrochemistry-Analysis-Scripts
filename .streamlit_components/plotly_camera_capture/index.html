<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="./plotly.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }
    #plot {
      width: 100%;
      height: 100%;
    }
    #controls {
      display: none;
      gap: 8px;
      margin: 8px 0 0 0;
      align-items: center;
      flex-wrap: wrap;
    }
    #download, #cache-view {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 4px 12px;
      border: 1px solid rgba(49,51,63,0.2);
      border-radius: 8px;
      background: #fff;
      color: rgb(49,51,63);
      font: 14px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
    }
    #cache-view.cached {
      border-color: rgba(22,163,74,0.55);
      color: rgb(22,101,52);
    }
  </style>
</head>
<body>
  <div id="plot"></div>
  <div id="controls">
    <button id="cache-view" type="button">Cache view</button>
    <button id="download" type="button">Download plot</button>
  </div>
  <script>
    const STREAMLIT_READY = "streamlit:componentReady";
    const STREAMLIT_RENDER = "streamlit:render";
    const STREAMLIT_SET_FRAME_HEIGHT = "streamlit:setFrameHeight";
    const SHARED_CAMERA_KEY = "bo_viewer_camera:latest_3d_perspective";
    const graph = document.getElementById("plot");
    const controls = document.getElementById("controls");
    const downloadButton = document.getElementById("download");
    const cacheViewButton = document.getElementById("cache-view");
    let latestArgs = null;
    let sendTimer = null;
    let resizeTimer = null;
    let suppressCameraEvents = false;
    let lastCamera = null;
    let plotVisible = !window.IntersectionObserver;
    let renderPromise = Promise.resolve();
    let exportInProgress = false;

    function releasePlot() {
      if (!graph._fullLayout) return;
      const camera = renderedCamera();
      if (camera) persistCameraNow(camera);
      // Keep legend visibility, axis ranges and camera when recreating the plot.
      latestArgs.figure = JSON.parse(JSON.stringify({data: graph.data, layout: graph.layout}));
      const contexts = Object.keys(graph._fullLayout)
        .filter(key => /^scene[0-9]*$/.test(key))
        .map(key => graph._fullLayout[key]._scene)
        .filter(scene => scene && scene.glplot)
        .map(scene => scene.glplot.gl);
      Plotly.purge(graph);
      // Purging removes Plotly objects but does not explicitly release the
      // browser's limited WebGL context slots.
      contexts.forEach(function(gl) {
        const extension = gl.getExtension("WEBGL_lose_context");
        if (extension && !gl.isContextLost()) extension.loseContext();
      });
    }

    function sceneContextLost() {
      return graph._fullLayout && Object.keys(graph._fullLayout).some(function(key) {
        const scene = /^scene[0-9]*$/.test(key) && graph._fullLayout[key]._scene;
        return scene && scene.glplot && scene.glplot.gl.isContextLost();
      });
    }

    function streamlitMessage(type, data) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: type,
        ...data,
      }, "*");
    }

    function setFrameHeight(height) {
      streamlitMessage(STREAMLIT_SET_FRAME_HEIGHT, {height: height});
    }

    function setComponentValue(value) {
      streamlitMessage("streamlit:setComponentValue", {value: value});
    }

    function loadCamera(storageKey) {
      try {
        const raw = window.localStorage.getItem(storageKey);
        return raw ? JSON.parse(raw) : null;
      } catch (error) {
        return null;
      }
    }

    function saveCamera(storageKey, camera) {
      if (!storageKey || !camera || !camera.eye) {
        return;
      }
      try {
        window.localStorage.setItem(storageKey, JSON.stringify(camera));
      } catch (error) {}
    }

    function loadNumber(storageKey) {
      try {
        const value = Number(window.localStorage.getItem(storageKey) || 0);
        return Number.isFinite(value) ? value : 0;
      } catch (error) {
        return 0;
      }
    }

    function saveNumber(storageKey, value) {
      try {
        window.localStorage.setItem(storageKey, String(Number(value) || 0));
      } catch (error) {}
    }

    function renderedCamera() {
      const scene = (
        graph._fullLayout &&
        graph._fullLayout.scene &&
        graph._fullLayout.scene._scene
      ) ? graph._fullLayout.scene._scene : null;
      if (scene && typeof scene.getCamera === "function") {
        try {
          const camera = scene.getCamera();
          if (camera && camera.eye) {
            return JSON.parse(JSON.stringify(camera));
          }
        } catch (error) {}
      }
      if (scene && scene.camera && scene.camera.eye) {
        try {
          return JSON.parse(JSON.stringify(scene.camera));
        } catch (error) {}
      }
      const renderedCamera = (
        graph._fullLayout &&
        graph._fullLayout.scene &&
        graph._fullLayout.scene.camera
      ) ? graph._fullLayout.scene.camera : null;
      return renderedCamera ? JSON.parse(JSON.stringify(renderedCamera)) : null;
    }

    function mergeCameraUpdate(update) {
      const baseCamera = renderedCamera() || (
        graph.layout &&
        graph.layout.scene &&
        graph.layout.scene.camera
      );
      const current = baseCamera ? JSON.parse(JSON.stringify(baseCamera)) : {};
      if (
        update &&
        Object.prototype.hasOwnProperty.call(update, "scene.camera") &&
        update["scene.camera"] &&
        typeof update["scene.camera"] === "object"
      ) {
        ["eye", "center", "up"].forEach(function(part) {
          if (
            update["scene.camera"][part] &&
            typeof update["scene.camera"][part] === "object"
          ) {
            current[part] = current[part] || {};
            ["x", "y", "z"].forEach(function(axis) {
              if (Object.prototype.hasOwnProperty.call(update["scene.camera"][part], axis)) {
                current[part][axis] = update["scene.camera"][part][axis];
              }
            });
          }
        });
      }
      ["eye", "center", "up"].forEach(function(part) {
        const partKey = "scene.camera." + part;
        if (
          update &&
          Object.prototype.hasOwnProperty.call(update, partKey) &&
          update[partKey] &&
          typeof update[partKey] === "object"
        ) {
          current[part] = current[part] || {};
          ["x", "y", "z"].forEach(function(axis) {
            if (Object.prototype.hasOwnProperty.call(update[partKey], axis)) {
              current[part][axis] = update[partKey][axis];
            }
          });
        }
        ["x", "y", "z"].forEach(function(axis) {
          const key = "scene.camera." + part + "." + axis;
          if (update && Object.prototype.hasOwnProperty.call(update, key)) {
            current[part] = current[part] || {};
            current[part][axis] = update[key];
          }
        });
      });
      return current;
    }

    function hasCameraUpdate(update) {
      if (!update) {
        return false;
      }
      if (Object.prototype.hasOwnProperty.call(update, "scene.camera")) {
        return true;
      }
      return Object.keys(update).some(function(key) {
        return key.indexOf("scene.camera.") === 0;
      });
    }

    function persistUserCamera(camera) {
      if (!latestArgs || !camera || !camera.eye) {
        return;
      }
      lastCamera = JSON.parse(JSON.stringify(camera));
      saveCamera(latestArgs.storage_key, camera);
    }

    function persistCameraNow(camera) {
      if (latestArgs && latestArgs.storage_key) {
        saveCamera(latestArgs.storage_key, camera);
      }
      persistUserCamera(camera);
    }

    function scheduleCameraSend(camera) {
      persistCameraNow(camera);
      window.clearTimeout(sendTimer);
      sendTimer = window.setTimeout(function() {
        persistUserCamera(camera);
      }, 50);
    }

    function persistRenderedCamera() {
      return;
    }

    function persistSettledRenderedCamera() {
      persistRenderedCamera();
      window.setTimeout(persistRenderedCamera, 25);
      window.setTimeout(persistRenderedCamera, 75);
      window.setTimeout(persistRenderedCamera, 150);
    }

    function safeFileStem(value) {
      const stem = String(value || "plot")
        .replace(/[^A-Za-z0-9._-]+/g, "_")
        .replace(/^_+|_+$/g, "");
      return stem || "plot";
    }

    function triggerDataUrlDownload(dataUrl, filename) {
      const link = document.createElement("a");
      link.href = dataUrl;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function loadSnapshotImage(source) {
      return new Promise(function(resolve, reject) {
        const picture = new Image();
        picture.onload = () => resolve(picture);
        picture.onerror = () => reject(new Error("Could not load the plot snapshot"));
        picture.src = source;
      });
    }

    async function captureSceneImage(scene) {
      for (let attempt = 0; attempt < 3; attempt++) {
        // Safari can clear a resized WebGL buffer before it has painted again.
        await new Promise(resolve => window.requestAnimationFrame(resolve));
        if (scene.glplot.gl.isContextLost()) {
          throw new Error("The 3D graphics context was lost during download");
        }
        const check = document.createElement("canvas");
        const gl = scene.glplot.gl;
        check.width = gl.drawingBufferWidth;
        check.height = gl.drawingBufferHeight;
        const context = check.getContext("2d", {willReadFrequently: true});
        if (attempt === 1) {
          // Alternate capture path if the browser cannot copy a WebGL canvas.
          const picture = await loadSnapshotImage(scene.toImage("png"));
          context.drawImage(picture, 0, 0, check.width, check.height);
        } else {
          // Copy synchronously after drawing, before Safari can discard the
          // drawing buffer. This also avoids Plotly's readPixels export path.
          scene.glplot.redraw();
          context.drawImage(gl.canvas, 0, 0, check.width, check.height);
        }
        const pixels = context.getImageData(0, 0, check.width, check.height).data;
        // Check the scene alone; legends/colorbars must not make a blank scene
        // pass validation. A uniform/transparent buffer has no rendered detail.
        for (let i = 4; i < pixels.length; i += 4) {
          if (pixels[i + 3] && (
            pixels[i] !== pixels[0] || pixels[i + 1] !== pixels[1] ||
            pixels[i + 2] !== pixels[2] || pixels[i + 3] !== pixels[3]
          )) return check;
        }
      }
      throw new Error("The browser returned an empty 3D snapshot. Rotate the plot and retry.");
    }

    async function captureLive3DPlot(options) {
      // Capture the live WebGL scene and SVG overlays separately. Safari can
      // omit PNGs embedded inside an SVG when that SVG is drawn to a canvas.
      // Drawing decoded scene PNGs directly avoids that nested-image path.
      const originalSize = {
        width: graph.layout.width == null ? null : graph.layout.width,
        height: graph.layout.height == null ? null : graph.layout.height,
        autosize: graph.layout.autosize,
      };
      try {
        await Plotly.relayout(graph, {
          width: options.width, height: options.height, autosize: false,
        });
        const layout = graph._fullLayout;
        const canvas = document.createElement("canvas");
        canvas.width = options.width * options.scale;
        canvas.height = options.height * options.scale;
        const context = canvas.getContext("2d");
        context.scale(options.scale, options.scale);
        context.fillStyle = layout.paper_bgcolor;
        context.fillRect(0, 0, options.width, options.height);
        const size = layout._size;
        for (const id of layout._subplots.gl3d) {
          const scene = layout[id];
          const picture = await captureSceneImage(scene._scene);
          context.drawImage(picture,
            size.l + size.w * scene.domain.x[0],
            size.t + size.h * (1 - scene.domain.y[1]),
            size.w * (scene.domain.x[1] - scene.domain.x[0]),
            size.h * (scene.domain.y[1] - scene.domain.y[0]));
        }
        const svg = layout._paper.node().cloneNode(true);
        svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
        svg.setAttribute("width", options.width);
        svg.setAttribute("height", options.height);
        svg.setAttribute("viewBox", `0 0 ${layout.width} ${layout.height}`);
        svg.style.background = "";
        if (layout._toppaper) {
          for (const child of layout._toppaper.node().children) {
            svg.appendChild(child.cloneNode(true));
          }
        }
        svg.querySelectorAll(".glimages,.draglayer,.hoverlayer").forEach(node => node.remove());
        const overlay = await loadSnapshotImage(
          "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
            new XMLSerializer().serializeToString(svg)
          )
        );
        context.drawImage(overlay, 0, 0, options.width, options.height);
        return canvas.toDataURL("image/png");
      } finally {
        await Plotly.relayout(graph, originalSize);
      }
    }

    async function downloadCurrentPlot() {
      if (!latestArgs || exportInProgress) return;
      exportInProgress = true;
      downloadButton.disabled = true;
      downloadButton.textContent = "Preparing download…";
      const options = {
        format: "png",
        width: Number(latestArgs.download_width) || 1200,
        height: Number(latestArgs.download_height) || Number(latestArgs.height) || 700,
        scale: 2,
      };
      const filename = safeFileStem(latestArgs.download_file_stem) + ".png";
      try {
        await renderPromise;
        if (sceneContextLost()) releasePlot();
        if (!graph._fullLayout) {
          render(latestArgs);
          await renderPromise;
        }
        const camera = renderedCamera() || lastCamera;
        if (latestArgs.camera_enabled !== false && camera && camera.eye) {
          persistCameraNow(camera);
          await Plotly.relayout(graph, {"scene.camera": camera});
        }
        // Await Plotly itself rather than racing delayed resizes against export.
        const has3DScene = (graph._fullLayout._subplots.gl3d || []).length > 0;
        const dataUrl = has3DScene
          ? await captureLive3DPlot(options)
          : await Plotly.toImage(graph, options);
        triggerDataUrlDownload(dataUrl, filename);
        downloadButton.textContent = "Download plot";
        downloadButton.title = "";
      } catch (error) {
        console.error("Plotly image export failed", error);
        downloadButton.textContent = "Download failed — retry";
        downloadButton.title = error.message;
      } finally {
        exportInProgress = false;
        downloadButton.disabled = false;
        if (!plotVisible || sceneContextLost()) {
          releasePlot();
          if (plotVisible) render(latestArgs);
        }
      }
    }

    function cacheCurrentView() {
      const camera = (
        lastCamera ||
        renderedCamera() ||
        loadCamera(latestArgs && latestArgs.storage_key)
      );
      if (!latestArgs || !camera || !camera.eye) {
        return;
      }
      lastCamera = JSON.parse(JSON.stringify(camera));
      saveCamera(latestArgs.storage_key, camera);
      saveCamera(latestArgs.shared_storage_key || SHARED_CAMERA_KEY, camera);
      setComponentValue({
        type: "cache_view",
        camera: camera,
        storage_key: latestArgs.storage_key,
        shared_storage_key: latestArgs.shared_storage_key || SHARED_CAMERA_KEY,
      });
      cacheViewButton.textContent = "Cached view";
      cacheViewButton.classList.add("cached");
      window.setTimeout(function() {
        cacheViewButton.textContent = "Cache view";
        cacheViewButton.classList.remove("cached");
      }, 1200);
    }

    function cacheSettledCurrentView() {
      window.setTimeout(cacheCurrentView, 75);
    }

    function requestPlotResize() {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(function() {
        if (graph && graph._fullLayout && !exportInProgress) {
          Plotly.Plots.resize(graph);
        }
      }, 50);
    }

    function render(args) {
      latestArgs = args || {};
      const height = Number(latestArgs.height || 700);
      const showCacheView = Boolean(latestArgs.show_cache_view);
      const showDownload = Boolean(latestArgs.show_download);
      const showControls = showDownload || showCacheView;
      graph.style.height = height + "px";
      controls.style.display = showControls ? "flex" : "none";
      downloadButton.style.display = showDownload ? "inline-flex" : "none";
      cacheViewButton.style.display = showCacheView ? "inline-flex" : "none";
      setFrameHeight(height + (showControls ? 52 : 0));
      window.clearTimeout(sendTimer);

      if (!plotVisible && !exportInProgress) return;
      renderPromise = renderPromise.catch(function(error) {
        console.error("Plotly render failed", error);
      }).then(function() {
        if (!plotVisible && !exportInProgress) return;
        const figure = JSON.parse(JSON.stringify(latestArgs.figure || {}));
        figure.layout = figure.layout || {};
        const cameraEnabled = latestArgs.camera_enabled !== false;
        if (cameraEnabled) {
          figure.layout.scene = figure.layout.scene || {};
          figure.layout.scene.dragmode = "turntable";
        }
        const storedCamera = cameraEnabled ? loadCamera(latestArgs.storage_key) : null;
        const initialCamera = cameraEnabled
          ? latestArgs.sync_camera || storedCamera || latestArgs.camera || figure.layout.scene.camera
          : null;
        if (initialCamera) {
          lastCamera = JSON.parse(JSON.stringify(initialCamera));
          figure.layout.scene.camera = initialCamera;
          saveCamera(latestArgs.storage_key, initialCamera);
        } else {
          lastCamera = null;
        }
        const config = {
          responsive: true,
          displaylogo: false,
          scrollZoom: true,
          preserveDrawingBuffer: true,
          modeBarButtonsToRemove: ["toImage"],
        };
        suppressCameraEvents = true;
        const pendingRender = Plotly.react(graph, figure.data || [], figure.layout, config).then(function() {
          requestPlotResize();
          if (initialCamera) {
            return Plotly.relayout(graph, {"scene.camera": initialCamera});
          }
          return null;
        }).finally(function() {
          requestPlotResize();
          window.setTimeout(requestPlotResize, 250);
          window.setTimeout(function() {
            suppressCameraEvents = false;
          }, 0);
        });
        graph.removeAllListeners && graph.removeAllListeners("plotly_webglcontextlost");
        graph.on("plotly_webglcontextlost", function() {
          // Recreate a visible scene once rendering/export has settled.
          renderPromise.then(function() {
            if (exportInProgress) return;
            releasePlot();
            if (plotVisible) render(latestArgs);
          });
        });
        graph.removeAllListeners && graph.removeAllListeners("plotly_relayout");
        graph.removeAllListeners && graph.removeAllListeners("plotly_relayouting");
        graph.on("plotly_relayout", function(update) {
          if (suppressCameraEvents || !hasCameraUpdate(update)) {
            return;
          }
          lastCamera = mergeCameraUpdate(update);
        });
        graph.on("plotly_relayouting", function(update) {
          if (suppressCameraEvents || !hasCameraUpdate(update)) {
            return;
          }
          lastCamera = mergeCameraUpdate(update);
        });
        return pendingRender;
      });
    }

    if (window.IntersectionObserver) {
      new IntersectionObserver(function(entries) {
        plotVisible = entries.some(entry => entry.isIntersecting);
        if (!latestArgs) return;
        if (plotVisible) {
          if (!graph._fullLayout) render(latestArgs);
        } else {
          renderPromise.then(function() {
            if (!plotVisible && !exportInProgress) releasePlot();
          });
        }
      }).observe(graph);
    }

    window.addEventListener("message", function(event) {
      const data = event.data || {};
      if (data.type !== STREAMLIT_RENDER) {
        return;
      }
      render((data.args || {}));
    });
    window.addEventListener("resize", requestPlotResize);
    window.addEventListener("pointerup", persistSettledRenderedCamera);
    window.addEventListener("mouseup", persistSettledRenderedCamera);
    window.addEventListener("touchend", persistSettledRenderedCamera);
    graph.addEventListener("pointerup", persistSettledRenderedCamera);
    graph.addEventListener("mouseup", persistSettledRenderedCamera);
    graph.addEventListener("touchend", persistSettledRenderedCamera);
    graph.addEventListener("wheel", function() {
      window.setTimeout(persistSettledRenderedCamera, 0);
    });
    downloadButton.addEventListener("click", downloadCurrentPlot);
    cacheViewButton.addEventListener("click", cacheSettledCurrentView);
    if (window.ResizeObserver) {
      new ResizeObserver(requestPlotResize).observe(document.body);
    }

    streamlitMessage(STREAMLIT_READY, {apiVersion: 1});
    setFrameHeight(700);
  </script>
</body>
</html>
