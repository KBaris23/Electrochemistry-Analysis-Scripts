<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light; }
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      color: #1f2937;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
    }
    #toolbar {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 32px;
      flex-wrap: wrap;
      color: #4b5563;
      font-size: 13px;
    }
    #selection-count {
      color: #1d4ed8;
      font-weight: 600;
    }
    #apply-layout {
      margin-left: auto;
      padding: 4px 10px;
      border: 1px solid #2563eb;
      border-radius: 5px;
      background: #2563eb;
      color: #fff;
      font: 12px/1.2 inherit;
      cursor: pointer;
    }
    #apply-layout:disabled {
      border-color: #cbd5e1;
      background: #e5e7eb;
      color: #6b7280;
      cursor: default;
    }
    #delete-selected {
      padding: 4px 10px;
      border: 1px solid #dc2626;
      border-radius: 5px;
      background: #fff;
      color: #b91c1c;
      font: 12px/1.2 inherit;
      cursor: pointer;
    }
    #delete-selected:disabled {
      border-color: #cbd5e1;
      color: #9ca3af;
      cursor: default;
    }
    #canvas {
      position: relative;
      box-sizing: border-box;
      overflow: hidden;
      border: 1px solid #9ca3af;
      border-radius: 5px;
      background-color: #fff;
      background-image:
        linear-gradient(to right, rgba(148, 163, 184, .18) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, .18) 1px, transparent 1px);
      background-size: 1% 1%;
      touch-action: none;
    }
    .panel {
      position: absolute;
      box-sizing: border-box;
      min-width: 18px;
      min-height: 18px;
      border: 2px solid #2563eb;
      border-radius: 4px;
      background: rgba(59, 130, 246, .14);
      cursor: move;
      touch-action: none;
    }
    .panel.selected {
      border-color: #dc2626;
      background: rgba(239, 68, 68, .15);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, .9), 0 0 0 4px rgba(220, 38, 38, .35);
    }
    .panel.dragging { opacity: .86; }
    .label {
      position: absolute;
      top: 5px;
      left: 7px;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, .9);
      font-size: 14px;
      font-weight: 700;
      pointer-events: none;
    }
    .dimensions {
      position: absolute;
      left: 7px;
      bottom: 5px;
      padding: 1px 4px;
      border-radius: 3px;
      background: rgba(255, 255, 255, .84);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
    .resize-handle {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 16px;
      height: 16px;
      box-sizing: border-box;
      border-top: 2px solid #fff;
      border-left: 2px solid #fff;
      background: #2563eb;
      cursor: nwse-resize;
      touch-action: none;
    }
    .panel.selected .resize-handle { background: #dc2626; }
    #context-menu {
      position: fixed;
      z-index: 10000;
      display: none;
      min-width: 190px;
      padding: 5px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .20);
    }
    #context-menu.open { display: block; }
    #context-menu button {
      display: block;
      width: 100%;
      padding: 6px 9px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #1f2937;
      font: 13px/1.2 inherit;
      text-align: left;
      cursor: pointer;
    }
    #context-menu button:hover { background: #eff6ff; }
    #context-menu button:disabled { color: #9ca3af; cursor: default; }
    #context-menu button:disabled:hover { background: transparent; }
    .separator { height: 1px; margin: 4px 3px; background: #e5e7eb; }
  </style>
</head>
<body>
  <div id="toolbar">
    <span>Mouse layout editor</span>
    <span id="selection-count"></span>
    <span id="status"></span>
    <button id="delete-selected" type="button" disabled>Delete selected</button>
    <button id="apply-layout" type="button" disabled>Apply layout</button>
  </div>
  <div id="viewport" style="max-height:850px;overflow:auto;border:1px solid #e5e7eb">
    <div id="canvas" tabindex="0" aria-label="Figure layout editor"></div>
  </div>
  <div id="edit-tools" style="display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;font-size:12px">
    <label><input id="snap" type="checkbox" checked> Snap</label>
    <label>Workspace zoom <select id="workspace-zoom"><option value="page">Fit whole figure</option><option value=".75">75%</option><option value="1" selected>Fit width</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></label>
    <label>Grid <select id="grid"><option value=".01" selected>1%</option><option value=".025">2.5%</option><option value=".05">5%</option></select></label>
    <button id="undo" title="Undo layout edit (Ctrl/Cmd+Z)">Undo</button><button id="redo" title="Redo layout edit (Ctrl/Cmd+Shift+Z or Ctrl+Y)">Redo</button>
    <button id="square">Square</button>
    <button id="copy" title="Ctrl/Cmd+C">Copy</button><button id="paste" title="Ctrl/Cmd+V">Paste</button>
    <button id="edit-content">Edit plot settings</button>
    <button id="reset-layout" title="Discard local layout edits and reload the latest saved layout">Reset edits</button>
    <div style="flex-basis:100%;display:flex;align-items:center;flex-wrap:wrap;gap:10px">
    <span>Selected block:</span>
    <label>X % <input id="pos-x" type="number" min="0" max="95" step=".5" style="width:55px"></label>
    <label>Y % <input id="pos-y" type="number" min="0" max="95" step=".5" style="width:55px"></label>
    <label>Width % <input id="pos-w" type="number" min="5" max="100" step=".5" style="width:55px"></label>
    <label>Height % <input id="pos-h" type="number" min="5" max="100" step=".5" style="width:55px"></label>
    <span>Enter a value, then Tab or click outside. Y starts at the bottom. Apply layout to save.</span>
    </div>
  </div>
  <div id="context-menu">
    <button data-command="left">Align left edges</button>
    <button data-command="hcenter">Align horizontal centers</button>
    <button data-command="right">Align right edges</button>
    <button data-command="top">Align top edges</button>
    <button data-command="vcenter">Align vertical centers</button>
    <button data-command="bottom">Align bottom edges</button>
    <div class="separator"></div>
    <button data-command="width">Make same width</button>
    <button data-command="height">Make same height</button>
    <button data-command="size">Make same size</button>
    <div class="separator"></div>
    <button data-command="distribute-h">Distribute horizontally</button>
    <button data-command="distribute-v">Distribute vertically</button>
    <div class="separator"></div>
    <button data-command="delete">Delete selected panel(s)</button>
  </div>
  <script>
    const canvas = document.getElementById("canvas");
    const menu = document.getElementById("context-menu");
    const selectionCount = document.getElementById("selection-count");
    const status = document.getElementById("status");
    const applyButton = document.getElementById("apply-layout");
    const deleteButton = document.getElementById("delete-selected");
    let args = {};
    let rects = [];
    let selected = new Set();
    let gesture = null;
    let contextAnchor = null;
    let dirty = false;
    let lastInputSignature = "";
    let clipboard = [];
    let undoStack = [], redoStack = [];
    let latestIncoming = [];
    const snapshot = () => rects.map(rect => [...rect]);
    function remember(before = snapshot()) {
      undoStack.push(before);
      if (undoStack.length > 100) undoStack.shift();
      redoStack = [];
    }
    function undoLayout(redo = false) {
      const from = redo ? redoStack : undoStack;
      const to = redo ? undoStack : redoStack;
      if (!from.length || gesture) return;
      to.push(snapshot());
      rects = from.pop();
      draw(); markDirty(redo ? "redo pending" : "undo pending");
    }
    document.getElementById("undo").onclick = () => undoLayout();
    document.getElementById("redo").onclick = () => undoLayout(true);
    document.getElementById("reset-layout").onclick = () => {
      rects = latestIncoming.map(rect => [...rect]);
      undoStack = []; redoStack = []; dirty = false;
      applyButton.disabled = true;
      draw(); status.textContent = "Saved layout restored";
    };
    document.getElementById("edit-content").onclick = () => {
      if (selected.size === 1) publishLayout("opening plot settings", [...selected][0]);
    };
    const snapped = value => document.getElementById("snap").checked
      ? Math.round(value / Number(document.getElementById("grid").value)) * Number(document.getElementById("grid").value)
      : value;
    function copyPanels() {
      clipboard = [...selected];
      status.textContent = clipboard.length + " panel(s) copied";
    }
    function pastePanels() {
      if (!clipboard.length) return;
      setComponentValue({event_id: Date.now() + "-paste", rects,
        duplicate_indices: clipboard.filter(i => i < rects.length)});
    }
    document.getElementById("copy").onclick = copyPanels;
    document.getElementById("paste").onclick = pastePanels;
    document.getElementById("square").onclick = () => {
      if (!selected.size) return;
      remember();
      selected.forEach(i => {
        const r = rects[i];
        const h = Math.min(r[2] * aspectRatio(args.aspect), 1 - r[1]);
        rects[i] = normalizedRect([r[0], r[1], h / aspectRatio(args.aspect), h]);
      });
      draw(); markDirty("square size pending");
    };
    ["x", "y", "w", "h"].forEach((key, axis) => {
      document.getElementById("pos-" + key).onchange = event => {
        if (!Number.isFinite(event.target.valueAsNumber) || !selected.size) return;
        remember();
        selected.forEach(i => {
          const value = clamp(event.target.valueAsNumber / 100, axis < 2 ? 0 : .05, 1);
          rects[i][axis] = value;
          // Preserve the requested size by moving the block inward if needed.
          if (axis >= 2) rects[i][axis - 2] = Math.min(rects[i][axis - 2], 1 - value);
          else rects[i][axis] = Math.min(value, 1 - rects[i][axis + 2]);
          rects[i] = normalizedRect(rects[i]);
        });
        draw(); markDirty("dimensions pending");
      };
    });
    document.getElementById("grid").onchange = () => {
      const percent = Number(document.getElementById("grid").value) * 100;
      canvas.style.backgroundSize = percent + "% " + percent + "%";
    };
    document.getElementById("workspace-zoom").onchange = () => { sizeCanvas(); draw(); };

    function streamlitMessage(type, data = {}) {
      window.parent.postMessage({isStreamlitMessage: true, type, ...data}, "*");
    }
    function setFrameHeight(height) {
      streamlitMessage("streamlit:setFrameHeight", {height});
    }
    function publishLayout(message, activeIndex = null) {
      if (!args.allow_overlap) {
        for (let i = 0; i < rects.length; i++) {
          for (let j = i + 1; j < rects.length; j++) {
            const a = rects[i], b = rects[j];
            if (Math.min(a[0]+a[2], b[0]+b[2])-Math.max(a[0],b[0]) > 1e-8 &&
                Math.min(a[1]+a[3], b[1]+b[3])-Math.max(a[1],b[1]) > 1e-8) {
              status.textContent = `Panels ${i+1} and ${j+1} overlap. Separate them or enable Allow overlap below the canvas.`;
              return;
            }
          }
        }
      }
      status.textContent = message ? `— ${message}` : "";
      setComponentValue({
        event_id: `${Date.now()}-${Math.random()}`,
        rects: rects.map(rect => [...rect]),
        active_index: activeIndex,
      });
      // Keep the draft protected until the server echoes the applied geometry.
      dirty = true;
      applyButton.disabled = true;
    }
    function markDirty(message) {
      dirty = true;
      applyButton.disabled = false;
      status.textContent = `— ${message}; click Apply layout`;
    }
    function setComponentValue(value) {
      streamlitMessage("streamlit:setComponentValue", {value});
    }
    function aspectRatio(name) {
      if (name === "Sweep workspace (9 x 10 in)") return 9 / 10;
      if (name === "16:9") return 16 / 9;
      if (name === "1:1") return 1;
      if (name === "Letter") return 8.5 / 11;
      if (name.startsWith("ACS 2-col square")) return 1;
      if (name.startsWith("ACS 2-col tall")) return 7 / 8.5;
      if (name.startsWith("ACS 2-col")) return 7 / 5.25;
      if (name.startsWith("ACS 1-col tall")) return 3.3 / 7.0;
      if (name.startsWith("ACS 1-col")) return 3.3 / 3;
      return 4 / 3;
    }
    function clamp(value, low, high) {
      return Math.min(Math.max(value, low), high);
    }
    function rounded(value) {
      return Math.round(value * 1000) / 1000;
    }
    function normalizedRect(values) {
      let [left, bottom, width, height] = values.map(Number);
      left = clamp(Number.isFinite(left) ? left : 0, 0, .95);
      bottom = clamp(Number.isFinite(bottom) ? bottom : 0, 0, .95);
      width = clamp(Number.isFinite(width) ? width : .25, .05, 1 - left);
      height = clamp(Number.isFinite(height) ? height : .25, .05, 1 - bottom);
      return [rounded(left), rounded(bottom), rounded(width), rounded(height)];
    }
    function sizeCanvas() {
      const ratio = aspectRatio(args.aspect);
      const availableWidth = Math.max(280, window.innerWidth - 4);
      const zoomValue = document.getElementById("workspace-zoom").value;
      // Editor-only uniform scaling: never modify normalized panel rectangles
      // or the physical figure dimensions used for rendering/export.
      const width = zoomValue === "page"
        ? Math.min(availableWidth, 800 * ratio)
        : availableWidth * Number(zoomValue);
      const height = width / ratio;
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      setFrameHeight(Math.ceil(Math.min(850,height) + document.getElementById("toolbar").offsetHeight + document.getElementById("edit-tools").offsetHeight + 18));
    }
    function updatePanel(element, rect) {
      element.style.left = `${rect[0] * 100}%`;
      element.style.bottom = `${rect[1] * 100}%`;
      element.style.width = `${rect[2] * 100}%`;
      element.style.height = `${rect[3] * 100}%`;
      element.querySelector(".dimensions").textContent =
        `x ${rect[0].toFixed(3)}  y ${rect[1].toFixed(3)}  w ${rect[2].toFixed(3)}  h ${rect[3].toFixed(3)}`;
    }
    function updateSelectionAppearance() {
      canvas.querySelectorAll(".panel").forEach(panel => {
        const index = Number(panel.dataset.index);
        panel.classList.toggle("selected", selected.has(index));
        panel.style.zIndex = selected.has(index) ? String(100 + index) : String(index + 1);
      });
      selectionCount.textContent = selected.size > 1 ? `${selected.size} panels selected` : "";
      deleteButton.disabled = selected.size === 0;
      document.getElementById("undo").disabled = undoStack.length === 0;
      document.getElementById("redo").disabled = redoStack.length === 0;
      document.getElementById("square").disabled = selected.size === 0;
      document.getElementById("copy").disabled = selected.size === 0;
      document.getElementById("edit-content").disabled = selected.size !== 1;
      const first = rects[[...selected][0]];
      ["x", "y", "w", "h"].forEach((key, axis) => {
        const input = document.getElementById("pos-" + key);
        input.disabled = !first;
        if (document.activeElement !== input) input.value = first ? rounded(first[axis] * 100) : "";
      });
    }
    function draw() {
      canvas.replaceChildren();
      selected = new Set([...selected].filter(index => index < rects.length));
      rects.forEach((rect, index) => {
        const panel = document.createElement("div");
        panel.className = "panel";
        panel.dataset.index = String(index);
        panel.innerHTML = '<span class="label"></span><span class="dimensions"></span>';
        ["nw", "n", "ne", "e", "se", "s", "sw", "w"].forEach(dir => {
          const handle = document.createElement("span");
          handle.className = "resize-handle";
          handle.dataset.direction = dir;
          handle.title = "Resize " + dir;
          Object.assign(handle.style, {
            width: "10px", height: "10px", right: "auto", bottom: "auto",
            left: dir.includes("w") ? "-5px" : dir.includes("e") ? "calc(100% - 5px)" : "calc(50% - 5px)",
            top: dir.includes("n") ? "-5px" : dir.includes("s") ? "calc(100% - 5px)" : "calc(50% - 5px)",
            cursor: dir + "-resize"
          });
          panel.appendChild(handle);
        });
        panel.querySelector(".label").textContent = (args.labels || [])[index] || String(index + 1);
        panel.title = "Drag to move; Ctrl/Cmd-click to select; right-click to align";
        updatePanel(panel, rect);
        panel.addEventListener("pointerdown", startGesture);
        panel.addEventListener("contextmenu", openContextMenu);
        canvas.appendChild(panel);
      });
      updateSelectionAppearance();
    }
    function hideContextMenu() {
      menu.classList.remove("open");
    }
    function startGesture(event) {
      if (event.button !== 0) return;
      event.preventDefault();
      canvas.focus({preventScroll: true});
      hideContextMenu();
      const panel = event.currentTarget;
      const index = Number(panel.dataset.index);
      const additive = event.ctrlKey || event.metaKey;
      if (additive) {
        if (selected.has(index)) selected.delete(index);
        else selected.add(index);
        updateSelectionAppearance();
        return;
      }
      if (!selected.has(index)) selected = new Set([index]);
      updateSelectionAppearance();
      const mode = event.target.classList.contains("resize-handle") ? "resize" : "move";
      const indices = mode === "move" ? [...selected] : [index];
      gesture = {
        pointerId: event.pointerId,
        panel,
        index,
        indices,
        mode,
        direction: event.target.dataset.direction,
        startX: event.clientX,
        startY: event.clientY,
        startRects: new Map(indices.map(item => [item, [...rects[item]]])),
        before: snapshot(),
      };
      indices.forEach(item => canvas.querySelector(`[data-index="${item}"]`)?.classList.add("dragging"));
      panel.setPointerCapture(event.pointerId);
      panel.addEventListener("pointermove", moveGesture);
      panel.addEventListener("pointerup", endGesture);
      panel.addEventListener("pointercancel", endGesture);
      status.textContent = mode === "resize" ? "— resizing" : "— moving";
    }
    function moveGesture(event) {
      if (!gesture || event.pointerId !== gesture.pointerId) return;
      if (!gesture.moved && Math.hypot(event.clientX - gesture.startX, event.clientY - gesture.startY) < 3) return;
      gesture.moved = true;
      let dx = (event.clientX - gesture.startX) / canvas.clientWidth;
      let bottomDelta = -(event.clientY - gesture.startY) / canvas.clientHeight;
      if (gesture.mode === "move") {
        const starts = [...gesture.startRects.values()];
        dx = snapped(starts[0][0] + dx) - starts[0][0];
        bottomDelta = snapped(starts[0][1] + bottomDelta) - starts[0][1];
        dx = clamp(
          dx,
          -Math.min(...starts.map(rect => rect[0])),
          Math.min(...starts.map(rect => 1 - rect[0] - rect[2])),
        );
        bottomDelta = clamp(
          bottomDelta,
          -Math.min(...starts.map(rect => rect[1])),
          Math.min(...starts.map(rect => 1 - rect[1] - rect[3])),
        );
        gesture.indices.forEach(index => {
          const start = gesture.startRects.get(index);
          rects[index] = normalizedRect([start[0] + dx, start[1] + bottomDelta, start[2], start[3]]);
          updatePanel(canvas.querySelector(`[data-index="${index}"]`), rects[index]);
        });
      } else {
        const start = gesture.startRects.get(gesture.index);
        let [left, bottom, width, height] = start;
        let right = left + width, top = bottom + height;
        const dir = gesture.direction;
        if (dir.includes("w")) left = clamp(snapped(left + dx), 0, right - .05);
        if (dir.includes("e")) right = clamp(snapped(right + dx), left + .05, 1);
        if (dir.includes("s")) bottom = clamp(snapped(bottom + bottomDelta), 0, top - .05);
        if (dir.includes("n")) top = clamp(snapped(top + bottomDelta), bottom + .05, 1);
        rects[gesture.index] = normalizedRect([left, bottom, right - left, top - bottom]);
        updatePanel(gesture.panel, rects[gesture.index]);
      }
    }
    function endGesture(event) {
      if (!gesture || event.pointerId !== gesture.pointerId) return;
      if (event.type !== "pointercancel") moveGesture(event);
      const finished = gesture;
      finished.indices.forEach(index => canvas.querySelector(`[data-index="${index}"]`)?.classList.remove("dragging"));
      finished.panel.removeEventListener("pointermove", moveGesture);
      finished.panel.removeEventListener("pointerup", endGesture);
      finished.panel.removeEventListener("pointercancel", endGesture);
      gesture = null;
      if (JSON.stringify(rects) === JSON.stringify(finished.before)) {
        status.textContent = "Selected — enter Width / Height below or drag a handle";
        return;
      }
      remember(finished.before);
      updateSelectionAppearance();
      markDirty(finished.mode === "resize" ? "resize pending" : "move pending");
    }
    function openContextMenu(event) {
      event.preventDefault();
      const index = Number(event.currentTarget.dataset.index);
      if (!selected.has(index)) selected = new Set([index]);
      contextAnchor = index;
      updateSelectionAppearance();
      const needsThree = new Set(["distribute-h", "distribute-v"]);
      menu.querySelectorAll("button").forEach(button => {
        button.disabled = button.dataset.command === "delete"
          ? selected.size === 0
          : selected.size < (needsThree.has(button.dataset.command) ? 3 : 2);
      });
      const menuWidth = 205;
      const menuHeight = 360;
      menu.style.left = `${Math.max(4, Math.min(event.clientX, window.innerWidth - menuWidth))}px`;
      menu.style.top = `${Math.max(4, Math.min(event.clientY, window.innerHeight - menuHeight))}px`;
      menu.classList.add("open");
    }
    function applyCommand(command) {
      const indices = [...selected];
      if (command === "delete") {
        deleteSelected();
        return;
      }
      if (indices.length < 2) return;
      remember();
      const anchor = rects[contextAnchor ?? indices[0]];
      if (command === "left") {
        const value = Math.min(...indices.map(index => rects[index][0]));
        indices.forEach(index => rects[index][0] = value);
      } else if (command === "right") {
        const value = Math.max(...indices.map(index => rects[index][0] + rects[index][2]));
        indices.forEach(index => rects[index][0] = value - rects[index][2]);
      } else if (command === "hcenter") {
        const value = indices.reduce((sum, index) => sum + rects[index][0] + rects[index][2] / 2, 0) / indices.length;
        indices.forEach(index => rects[index][0] = value - rects[index][2] / 2);
      } else if (command === "bottom") {
        const value = Math.min(...indices.map(index => rects[index][1]));
        indices.forEach(index => rects[index][1] = value);
      } else if (command === "top") {
        const value = Math.max(...indices.map(index => rects[index][1] + rects[index][3]));
        indices.forEach(index => rects[index][1] = value - rects[index][3]);
      } else if (command === "vcenter") {
        const value = indices.reduce((sum, index) => sum + rects[index][1] + rects[index][3] / 2, 0) / indices.length;
        indices.forEach(index => rects[index][1] = value - rects[index][3] / 2);
      } else if (command === "width" || command === "size") {
        indices.forEach(index => rects[index][2] = Math.min(anchor[2], 1 - rects[index][0]));
      }
      if (command === "height" || command === "size") {
        indices.forEach(index => rects[index][3] = Math.min(anchor[3], 1 - rects[index][1]));
      }
      if (command === "distribute-h" && indices.length >= 3) {
        indices.sort((a, b) => rects[a][0] - rects[b][0]);
        const left = rects[indices[0]][0];
        const right = rects[indices.at(-1)][0] + rects[indices.at(-1)][2];
        const width = indices.reduce((sum, index) => sum + rects[index][2], 0);
        const gap = (right - left - width) / (indices.length - 1);
        let cursor = left;
        indices.forEach(index => { rects[index][0] = cursor; cursor += rects[index][2] + gap; });
      } else if (command === "distribute-v" && indices.length >= 3) {
        indices.sort((a, b) => rects[a][1] - rects[b][1]);
        const bottom = rects[indices[0]][1];
        const top = rects[indices.at(-1)][1] + rects[indices.at(-1)][3];
        const height = indices.reduce((sum, index) => sum + rects[index][3], 0);
        const gap = (top - bottom - height) / (indices.length - 1);
        let cursor = bottom;
        indices.forEach(index => { rects[index][1] = cursor; cursor += rects[index][3] + gap; });
      }
      rects = rects.map(normalizedRect);
      hideContextMenu();
      draw();
      markDirty("alignment pending");
    }
    menu.querySelectorAll("button").forEach(button => {
      button.addEventListener("click", () => {
        if (!button.disabled) applyCommand(button.dataset.command);
      });
    });
    applyButton.addEventListener("click", () => {
      if (dirty) publishLayout("layout applied");
    });
    function deleteSelected() {
      const deletedIndices = [...selected].sort((a, b) => a - b);
      if (!deletedIndices.length) return;
      hideContextMenu();
      setComponentValue({
        event_id: `${Date.now()}-${Math.random()}`,
        rects: rects.map(rect => [...rect]),
        deleted_indices: deletedIndices,
      });
      status.textContent = "— deleting selected panel(s)";
      deleteButton.disabled = true;
    }
    deleteButton.addEventListener("click", deleteSelected);
    canvas.addEventListener("pointerdown", event => {
      if (event.target === canvas) {
        selected.clear();
        hideContextMenu();
        updateSelectionAppearance();
      }
    });
    document.addEventListener("pointerdown", event => {
      if (!menu.contains(event.target) && !event.target.closest?.(".panel")) hideContextMenu();
    });
    window.addEventListener("keydown", event => {
      if (event.target.closest("input, select, textarea")) return;
      if ((event.ctrlKey || event.metaKey) && ["z", "y"].includes(event.key.toLowerCase())) {
        event.preventDefault();
        undoLayout(event.key.toLowerCase() === "y" || event.shiftKey);
        return;
      }
      if ((event.ctrlKey || event.metaKey) && ["c", "v"].includes(event.key.toLowerCase())) {
        event.preventDefault();
        if (event.key.toLowerCase() === "c") copyPanels(); else pastePanels();
        return;
      }
      if (event.key === "Escape") {
        selected.clear();
        hideContextMenu();
        updateSelectionAppearance();
      } else if ((event.key === "Delete" || event.key === "Backspace") && selected.size) {
        event.preventDefault();
        deleteSelected();
      }
    });
    window.addEventListener("message", event => {
      if (!event.data || event.data.type !== "streamlit:render") return;
      args = event.data.args || {};
      if (!gesture) {
        const incoming = (args.rects || []).map(normalizedRect);
        const incomingSignature = JSON.stringify(incoming);
        latestIncoming = incoming.map(rect => [...rect]);
        // Preserve local edits through unrelated Streamlit renders until Apply.
        const structuralChange = incoming.length !== rects.length;
        const externalChange = !dirty && incomingSignature !== lastInputSignature && incomingSignature !== JSON.stringify(rects);
        if (!lastInputSignature || structuralChange || !dirty || incomingSignature === JSON.stringify(rects)) {
          if (structuralChange || externalChange) {
            undoStack = []; redoStack = []; clipboard = [];
          }
          rects = incoming;
          dirty = false;
          applyButton.disabled = true;
          lastInputSignature = incomingSignature;
        }
        sizeCanvas();
        draw();
      }
    });
    window.addEventListener("resize", () => {
      sizeCanvas();
      // CSS resizes existing blocks. Replacing them mid-drag loses capture.
    });
    streamlitMessage("streamlit:componentReady", {apiVersion: 1});
  </script>
</body>
</html>
